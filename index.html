<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>psytest</title>
<meta name="description" content="Test psicologici validati, calcolati sul tuo dispositivo: stile di attaccamento (ECR-R) e flessibilità psicologica (AAQ-II). Risultato condivisibile con un link.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="psy/app.css">
</head>
<body>
<div class="top"><a class="brand" href="index.html">psytest</a><span id="langPick"></span></div>
<div class="hero"><h1 id="title"></h1><p id="lede"></p></div>
<main class="tests" id="tests"></main>
<section class="how"><div class="card"><h2 id="howT"></h2><ol id="how"></ol></div></section>
<p class="foot" id="foot"></p>

<script src="lang/i18n.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const UI={
    it:{title:"Test psicologici, fatti bene",lede:"Strumenti validati dalla ricerca, con le domande originali e il punteggio ufficiale. Tutto calcolato sul tuo telefono, risultato condivisibile con un link.",
      tests:[{h:"ecr-r.html",k:"Test 1 · Attaccamento",t:"Come ami, davvero?",d:"Quanto temi di perdere l'altro e quanto ti è comodo appoggiarti: ansia ed evitamento, con la mappa dei quattro profili. Il test ECR-R.",m:["36 domande","~6 min"],b:"Inizia"},
             {h:"aaq-ii.html",k:"Test 2 · Flessibilità",t:"Quanto ti pesano le emozioni?",d:"Quanto emozioni, ricordi e preoccupazioni ti ostacolano: l'evitamento esperienziale del modello ACT, con le soglie di ricerca. Il test AAQ-II.",m:["7 domande","~2 min"],b:"Inizia",theme:"teal"}],
      howT:"Come funziona",how:["Ogni test è il questionario completo, nella forma e con lo scoring pubblicati dagli autori; il confronto è con i campioni di riferimento della letteratura.","Tutto viene calcolato sul tuo dispositivo: nessun account, nessun invio. Le risposte esistono solo nel link che scegli di creare alla fine, e quel link ricostruisce esattamente il risultato.","Sono strumenti di auto-esplorazione, non diagnosi. Se un risultato ti pesa, parlarne con un professionista è la mossa sensata."],
      foot:"ECR-R: Fraley, Waller & Brennan (2000). AAQ-II: Bond, Hayes et al. (2011); versione italiana Pennato et al. (2013). Strumenti di pubblico dominio per uso non commerciale; le traduzioni FR/ES/PT/DE sono proprie e non validate."},
    en:{title:"Psychological tests, done properly",lede:"Research-validated instruments with the original questions and official scoring. Everything computed on your phone, result shareable with a link.",
      tests:[{h:"ecr-r.html",k:"Test 1 · Attachment",t:"How do you really love?",d:"How much you fear losing the other and how comfortable you are leaning on them: anxiety and avoidance, with the map of the four profiles. The ECR-R test.",m:["36 questions","~6 min"],b:"Start"},
             {h:"aaq-ii.html",k:"Test 2 · Flexibility",t:"How much do your emotions weigh on you?",d:"How much emotions, memories and worries get in your way: experiential avoidance from the ACT model, with research thresholds. The AAQ-II test.",m:["7 questions","~2 min"],b:"Start",theme:"teal"}],
      howT:"How it works",how:["Each test is the complete questionnaire, in the form and with the scoring published by its authors; the comparison is with the reference samples in the literature.","Everything is computed on your device: no account, nothing sent. Your answers exist only in the link you choose to create at the end, and that link rebuilds the exact result.","These are self-exploration tools, not diagnoses. If a result weighs on you, talking to a professional is the sensible move."],
      foot:"ECR-R: Fraley, Waller & Brennan (2000). AAQ-II: Bond, Hayes et al. (2011); Italian version Pennato et al. (2013). Public-domain instruments for non-commercial use; FR/ES/PT/DE translations are our own and not validated."},
    fr:{title:"Des tests psychologiques, faits comme il faut",lede:"Des outils validés par la recherche, avec les questions originales et le score officiel. Tout est calculé sur ton téléphone, résultat partageable par un lien.",
      tests:[{h:"ecr-r.html",k:"Test 1 · Attachement",t:"Comment tu aimes, vraiment ?",d:"À quel point tu crains de perdre l'autre et à quel point tu es à l'aise pour t'appuyer sur lui : anxiété et évitement, avec la carte des quatre profils. Le test ECR-R.",m:["36 questions","~6 min"],b:"Commencer"},
             {h:"aaq-ii.html",k:"Test 2 · Flexibilité",t:"À quel point tes émotions te pèsent ?",d:"À quel point les émotions, les souvenirs et les inquiétudes te font obstacle : l'évitement expérientiel du modèle ACT, avec les seuils de recherche. Le test AAQ-II.",m:["7 questions","~2 min"],b:"Commencer",theme:"teal"}],
      howT:"Comment ça marche",how:["Chaque test est le questionnaire complet, dans la forme et avec le score publiés par ses auteurs ; la comparaison se fait avec les échantillons de référence de la littérature.","Tout est calculé sur ton appareil : pas de compte, rien d'envoyé. Tes réponses n'existent que dans le lien que tu choisis de créer à la fin, et ce lien reconstruit exactement le résultat.","Ce sont des outils d'auto-exploration, pas des diagnostics. Si un résultat te pèse, en parler à un professionnel est la démarche sensée."],
      foot:"ECR-R : Fraley, Waller & Brennan (2000). AAQ-II : Bond, Hayes et al. (2011) ; version italienne Pennato et al. (2013). Instruments du domaine public pour usage non commercial ; les traductions FR/ES/PT/DE sont les nôtres et non validées."},
    es:{title:"Tests psicológicos, hechos como es debido",lede:"Instrumentos validados por la investigación, con las preguntas originales y la puntuación oficial. Todo se calcula en tu teléfono, resultado compartible con un enlace.",
      tests:[{h:"ecr-r.html",k:"Test 1 · Apego",t:"¿Cómo amas, de verdad?",d:"Cuánto temes perder al otro y cuánto te resulta cómodo apoyarte: ansiedad y evitación, con el mapa de los cuatro perfiles. El test ECR-R.",m:["36 preguntas","~6 min"],b:"Empezar"},
             {h:"aaq-ii.html",k:"Test 2 · Flexibilidad",t:"¿Cuánto te pesan las emociones?",d:"Cuánto te obstaculizan las emociones, los recuerdos y las preocupaciones: la evitación experiencial del modelo ACT, con los umbrales de investigación. El test AAQ-II.",m:["7 preguntas","~2 min"],b:"Empezar",theme:"teal"}],
      howT:"Cómo funciona",how:["Cada test es el cuestionario completo, en la forma y con la puntuación publicadas por sus autores; la comparación es con las muestras de referencia de la literatura.","Todo se calcula en tu dispositivo: sin cuenta, sin envíos. Tus respuestas existen solo en el enlace que decidas crear al final, y ese enlace reconstruye exactamente el resultado.","Son herramientas de autoexploración, no diagnósticos. Si un resultado te pesa, hablarlo con un profesional es lo sensato."],
      foot:"ECR-R: Fraley, Waller & Brennan (2000). AAQ-II: Bond, Hayes et al. (2011); versión italiana Pennato et al. (2013). Instrumentos de dominio público para uso no comercial; las traducciones FR/ES/PT/DE son propias y no validadas."},
    pt:{title:"Testes psicológicos, feitos como se deve",lede:"Instrumentos validados pela pesquisa, com as perguntas originais e a pontuação oficial. Tudo calculado no seu celular, resultado compartilhável por link.",
      tests:[{h:"ecr-r.html",k:"Teste 1 · Apego",t:"Como você ama, de verdade?",d:"Quanto você teme perder o outro e quanto se sente à vontade para se apoiar: ansiedade e evitação, com o mapa dos quatro perfis. O teste ECR-R.",m:["36 perguntas","~6 min"],b:"Começar"},
             {h:"aaq-ii.html",k:"Teste 2 · Flexibilidade",t:"Quanto as emoções pesam para você?",d:"Quanto emoções, lembranças e preocupações atrapalham você: a evitação experiencial do modelo ACT, com os limiares de pesquisa. O teste AAQ-II.",m:["7 perguntas","~2 min"],b:"Começar",theme:"teal"}],
      howT:"Como funciona",how:["Cada teste é o questionário completo, na forma e com a pontuação publicadas pelos autores; a comparação é com as amostras de referência da literatura.","Tudo é calculado no seu dispositivo: sem conta, sem envio. Suas respostas existem só no link que você escolher criar no fim, e esse link reconstrói exatamente o resultado.","São ferramentas de autoexploração, não diagnósticos. Se um resultado pesa, conversar com um profissional é o passo sensato."],
      foot:"ECR-R: Fraley, Waller & Brennan (2000). AAQ-II: Bond, Hayes et al. (2011); versão italiana Pennato et al. (2013). Instrumentos de domínio público para uso não comercial; as traduções FR/ES/PT/DE são próprias e não validadas."},
    de:{title:"Psychologische Tests, richtig gemacht",lede:"Von der Forschung validierte Instrumente mit den Originalfragen und der offiziellen Auswertung. Alles auf deinem Handy berechnet, Ergebnis per Link teilbar.",
      tests:[{h:"ecr-r.html",k:"Test 1 · Bindung",t:"Wie liebst du wirklich?",d:"Wie sehr du fürchtest, den anderen zu verlieren, und wie leicht du dich anlehnen kannst: Angst und Vermeidung, mit der Karte der vier Profile. Der ECR-R-Test.",m:["36 Fragen","~6 Min."],b:"Starten"},
             {h:"aaq-ii.html",k:"Test 2 · Flexibilität",t:"Wie sehr belasten dich deine Gefühle?",d:"Wie sehr Gefühle, Erinnerungen und Sorgen dir im Weg stehen: Erlebnisvermeidung aus dem ACT-Modell, mit Forschungsschwellen. Der AAQ-II-Test.",m:["7 Fragen","~2 Min."],b:"Starten",theme:"teal"}],
      howT:"So funktioniert es",how:["Jeder Test ist der vollständige Fragebogen, in der Form und mit der Auswertung, die die Autoren veröffentlicht haben; verglichen wird mit den Referenzstichproben der Literatur.","Alles wird auf deinem Gerät berechnet: kein Konto, nichts wird gesendet. Deine Antworten existieren nur im Link, den du am Ende erstellen möchtest, und dieser Link stellt genau das Ergebnis wieder her.","Das sind Werkzeuge zur Selbsterkundung, keine Diagnosen. Wenn dich ein Ergebnis belastet, ist ein Gespräch mit einer Fachperson der vernünftige Schritt."],
      foot:"ECR-R: Fraley, Waller & Brennan (2000). AAQ-II: Bond, Hayes et al. (2011); italienische Version Pennato et al. (2013). Gemeinfreie Instrumente für nicht-kommerzielle Nutzung; die Übersetzungen FR/ES/PT/DE sind unsere eigenen und nicht validiert."}
  };
  function render(){
    const L=window.ZI18N?window.ZI18N.get():"it", u=UI[L]||UI.it;
    document.documentElement.lang=L;
    $("title").textContent=u.title; $("lede").textContent=u.lede;
    $("tests").innerHTML=u.tests.map(t=>`<a class="card" href="${t.h}"${t.theme?` data-theme="${t.theme}"`:""} style="text-decoration:none;color:inherit"><span class="kicker">${t.k}</span><h2>${t.t}</h2><p>${t.d}</p><div class="meta">${t.m.map(m=>`<span>${m}</span>`).join("")}</div><span class="btn">${t.b} →</span></a>`).join("");
    $("howT").textContent=u.howT; $("how").innerHTML=u.how.map(p=>`<li>${p}</li>`).join("");
    $("foot").textContent=u.foot;
    if(window.ZI18N) window.ZI18N.decorate();
  }
  if(window.ZI18N) window.ZI18N.mount($("langPick"));
  window.addEventListener("zlangchange",render);
  render();
})();
</script>
</body>
</html>
